# GoReleaser genera los "instalables": binarios para cada SO/arquitectura,
# archivos comprimidos, checksums y la imagen Docker, al publicar un tag vX.Y.Z.
version: 2
project_name: inventory

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: inventory
    main: ./cmd/inventory
    binary: inventory
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
