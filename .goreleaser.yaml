# GoReleaser genera los "instalables": binarios para cada SO/arquitectura,
# archivos comprimidos y checksums. Lo ejecuta .github/workflows/release.yml.
version: 2
project_name: inventory

before:
  hooks:
    # Sin `go mod tidy`: si modificara go.sum, el árbol quedaría "sucio" y
    # GoReleaser abortaría. La coherencia de go.mod la valida CI.
    - go mod verify
    - go test ./...

builds:
  - id: inventory
    main: ./cmd/inventory
    binary: inventory
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

# Las notas las genera .github/scripts/release-notes.sh (issues del milestone
# + PRs) y se pasan con --release-notes; el changelog propio no se usa.
changelog:
  disable: true

release:
  # RELEASE_NAME = "v0.2.0 — Seguridad y usuarios" cuando viene de un milestone.
  name_template: '{{ envOrDefault "RELEASE_NAME" .Tag }}'
  mode: replace
