version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    gosec:
      excludes:
        - G202 # concatenación SQL controlada (sólo placeholders "?"), ver sale_repo.go
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
    - goimports
