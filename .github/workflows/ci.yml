name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # bash en todos los SO: PowerShell parte "-coverprofile=coverage.out" en dos argumentos.
        shell: bash
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t inventory-go:ci .
      - name: Smoke test
        run: |
          docker run -d --name inv -p 8080:8080 -e INVENTORY_SEED=true inventory-go:ci
          for i in $(seq 1 20); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/api/v1/dashboard | grep -q '"active_products":5'
          docker rm -f inv
